# Checks every push and pull request; deploys to AWS (Lambda + CloudFront via SST) when main changes.
# Needs repo secrets AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and DIRECT_DATABASE_URL (Neon, for migrations), and (once the domain is live) repo
# variables SITE_DOMAIN, ADMIN_HOST and CERT_ARN. App secrets live in AWS SSM (scripts/aws-secrets.sh).
name: Deploy

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Type-check and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint src

  deploy:
    name: Deploy to AWS
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-south-1
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
      ADMIN_HOST: ${{ vars.ADMIN_HOST }}
      CERT_ARN: ${{ vars.CERT_ARN }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip until the AWS secrets are set
        if: env.AWS_ACCESS_KEY_ID == ''
        run: echo "::notice::AWS_ACCESS_KEY_ID is not set yet — skipping deploy. See DEPLOYMENT.md."

      - uses: actions/setup-node@v4
        if: env.AWS_ACCESS_KEY_ID != ''
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: env.AWS_ACCESS_KEY_ID != ''
        run: npm ci --no-audit --no-fund

      - name: Update the database
        if: env.AWS_ACCESS_KEY_ID != ''
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Deploy
        if: env.AWS_ACCESS_KEY_ID != ''
        run: npx sst deploy --stage production
