# Nginx site for the oneKampus website. server-setup.sh replaces __DOMAIN__; Certbot adds the HTTPS parts.
upstream onekampus_website {
    server 127.0.0.1:3300;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Product photo uploads are up to 5 MB.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Built JS/CSS have hashed names — cache them for a year.
    location /_next/static/ {
        proxy_pass http://onekampus_website;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://onekampus_website;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite (not append) so visitors can't fake their IP for the form rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
